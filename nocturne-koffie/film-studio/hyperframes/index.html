<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Nocturne — Kopi pahit padahal baru beli? Cek tiga hal ini.</title>
    <script src="./vendor/gsap.min.js"></script>
    <style>
      /* font brand: berkas lokal, bukan CDN — lint HyperFrames menolak keluarga
         font tanpa @font-face karena renderer tidak bisa menebak berkasnya */
      @font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block;
                   src: url("./vendor/fonts/bricolage-800.ttf") format("truetype"); }
      @font-face { font-family: "Fraunces"; font-weight: 300; font-display: block;
                   src: url("./vendor/fonts/fraunces-300.ttf") format("truetype"); }
      @font-face { font-family: "Inter"; font-weight: 400; font-display: block;
                   src: url("./vendor/fonts/inter-400.ttf") format("truetype"); }
      @font-face { font-family: "Inter"; font-weight: 600; font-display: block;
                   src: url("./vendor/fonts/inter-600.ttf") format("truetype"); }
      :root {
        --paper: #f5efe4; --paper-2: #efe6d6; --ink: #16110d;
        --orange: #e1542b; --espresso: #4a2c1a;
        --display: "Bricolage Grotesque", sans-serif;
        --serif: "Fraunces", serif;
        --body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--paper); }
      .latar { position: absolute; inset: 0; background: var(--paper-2); }
      .kemajuan { position: absolute; top: 0; left: 0; height: 8px; width: 1080px;
                  background: var(--orange); transform-origin: 0 50%; transform: scaleX(0); }
      .mount { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9"
         data-width="1080" data-height="1920">
      <div class="latar" id="latar"></div>
      <div class="kemajuan" id="kemajuan"></div>
      <div class="mount" id="mount-cue-1" data-composition-id="cue-1"
           data-composition-src="./compositions/cue-1.html"
           data-start="0.00" data-duration="3.00" data-track-index="0"></div>
      <div class="mount" id="mount-cue-2" data-composition-id="cue-2"
           data-composition-src="./compositions/cue-2.html"
           data-start="3.00" data-duration="2.00" data-track-index="1"></div>
      <div class="mount" id="mount-cue-3" data-composition-id="cue-3"
           data-composition-src="./compositions/cue-3.html"
           data-start="5.00" data-duration="2.00" data-track-index="2"></div>
      <div class="mount" id="mount-cue-4" data-composition-id="cue-4"
           data-composition-src="./compositions/cue-4.html"
           data-start="7.00" data-duration="2.00" data-track-index="3"></div>
    </div>
    <script>
      /* Timeline root: hanya lapisan milik root. Gerak per cue ada di sub-komposisi.
         120 BPM · 540 frame @ 60 fps · arc cold-open */
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kemajuan", { scaleX: 0 }, { scaleX: 1, duration: 9, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
