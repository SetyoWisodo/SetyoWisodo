<!DOCTYPE html>
<html lang="id" data-type="place">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rak Sangrai — Nocturne Koffie</title>
<meta name="description" content="Rak sangrai Nocturne: sembilan kemasan kopi 500 g berdiri di rak, satu ditarik keluar dan diputar menghadap Anda. Stiker 12 × 17 cm di muka belakang. Banyuwangi." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F5EFE4" />
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="../assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/css/fonts.css" />
<link rel="stylesheet" href="rak.css" />
</head>
<body>

<!-- butir kertas: satu lapisan, di atas rak, di bawah lembar detail -->
<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <a class="lbl box bar__back" href="../index.html">Kembali / Back</a>
  <div class="logo">
    <span class="logo__a">Nocturne</span>
    <span class="logo__b">Koffie · Banyuwangi</span>
  </div>
  <p class="lbl bar__right">Rak kemasan · 9 lot · 500 g</p>
</header>

<nav class="tabs" aria-label="Kategori lot">
  <div class="tabs__ind" id="tabsInd" aria-hidden="true"></div>
  <!-- tombol diisi rak.js dari window.RAK.TABS -->
</nav>

<section class="shelf" aria-label="Rak kemasan kopi" id="shelf">
  <div class="stage" id="stage"></div>
  <button class="ring" id="ring" aria-label="Buka lot">
    <svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1 L11 7 L1 13 Z" /></svg>
  </button>
</section>

<div class="cap" aria-live="polite" aria-atomic="true">
  <div class="mask cap__title"><span class="line"></span></div>
  <div class="mask cap__sub"><span class="line"></span></div>
  <div class="mask cap__meta"><span class="line"></span></div>
</div>

<button class="arrow arrow--l" id="prev" aria-label="Lot sebelumnya">
  <svg viewBox="0 0 18 10" aria-hidden="true"><path d="M5 1 L1 5 L5 9 M1 5 H17" /></svg>
</button>
<button class="arrow arrow--r" id="next" aria-label="Lot berikutnya">
  <svg viewBox="0 0 18 10" aria-hidden="true"><path d="M13 1 L17 5 L13 9 M17 5 H1" /></svg>
</button>

<footer class="foot">
  <span class="lbl">© Nocturne Koffie · Banyuwangi</span>
  <span class="lbl">
    <a href="https://instagram.com/nocturnekoffie" rel="noopener">IG</a> /
    <a href="https://wa.me/628988188800" rel="noopener">WA</a>
  </span>
</footer>

<!-- lembar detail: tumbuh dari muka kemasan, tinta menyebar -->
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Detail lot kopi">
  <button class="lbl box detail__close" id="close">Tutup / Close</button>
  <div class="detail__logo logo">
    <span class="logo__a">Nocturne</span>
    <span class="logo__b">Koffie · Banyuwangi</span>
  </div>
  <div class="detail__grid">
    <div class="detail__left">
      <div class="mask"><p class="detail__sub lbl line" id="dSub"></p></div>
      <div class="mask"><h2 class="detail__title line" id="dTitle"></h2></div>
      <div class="mask"><p class="detail__meta lbl line" id="dMeta"></p></div>
      <div class="mask"><p class="detail__syn line" id="dSyn"></p></div>
      <div class="mask"><p class="detail__harga line" id="dHarga"></p></div>
      <div class="mask"><p class="detail__credit line" id="dCredit"></p></div>
      <a class="detail__cta box" id="dCta" href="#" rel="noopener">Pesan lot / WhatsApp</a>
    </div>
    <div class="detail__right">
      <svg class="poster" viewBox="0 0 474 900" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
        <defs>
          <clipPath id="pclip"><rect x="0" y="0" width="474" height="900" rx="2" /></clipPath>
          <filter id="inkf" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="120"
                               xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <mask id="ink" maskUnits="userSpaceOnUse" x="-200" y="-200" width="874" height="1300">
            <g id="blobs" filter="url(#inkf)">
              <circle cx="150" cy="330" r="0" /><circle cx="340" cy="600" r="0" />
              <circle cx="250" cy="120" r="0" /><circle cx="90" cy="760" r="0" />
              <circle cx="400" cy="250" r="0" /><circle cx="260" cy="860" r="0" />
              <circle cx="230" cy="470" r="0" />
            </g>
          </mask>
        </defs>
        <g clip-path="url(#pclip)">
          <image id="pimg" mask="url(#ink)" preserveAspectRatio="none" />
        </g>
      </svg>
    </div>
  </div>
</div>

<!-- kursor kustom: cincin, titik, label BUKA -->
<div class="cur" id="cur" aria-hidden="true">
  <span class="cur__ring"></span>
  <span class="cur__dot"></span>
  <span class="cur__lbl">Buka<span>Open</span></span>
</div>

<script src="data.js"></script>
<script src="rak.js"></script>
</body>
</html>
