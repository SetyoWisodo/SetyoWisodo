  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // --- 1. Mockup Catalog Data (Screenshot 177) ---
    const MOCKUPS_DATA = [
      { id: '1', title: 'Coffee bag mockup', dims: '100 × 70 × 220 mm', icon: '🛍️', colors: ['#ffffff', '#cbd5e1', '#d4af37'], has3D: false },
      { id: '2', title: '10 × 7 × 22 stand-up coffee pouch mockup', dims: '100 × 70 × 220 mm', icon: '👝', colors: ['#a7f3d0', '#ffffff', '#78350f', '#d4af37'], has3D: false },
      { id: '3', title: 'Zipper pouch mockup', dims: '120 × 60 × 180 mm', icon: '👝', colors: ['#f472b6', '#ffffff', '#38bdf8'], has3D: false },
      { id: '4', title: '10 × 8 × 26 stand-up snack pouch mockup', dims: '100 × 80 × 260 mm', icon: '👝', colors: ['#93c5fd', '#ffffff', '#cbd5e1', '#d97706'], has3D: false },
      { id: '5', title: '13 × 9 × 24 stand-up tea pouch mockup', dims: '130 × 90 × 240 mm', icon: '👝', colors: ['#6ee7b7', '#ffffff', '#1e293b'], has3D: true },
      { id: '6', title: 'Standing pouch mockup', dims: '75 × 130 × 225 mm', icon: '👝', colors: ['#ffffff', '#cbd5e1', '#d4af37', '#a855f7'], has3D: true },
      { id: '7', title: 'Classic coffee pouch Mockup', dims: '110 × 75 × 230 mm', icon: '👝', colors: ['#fef08a', '#ffffff', '#334155', '#d4af37'], has3D: true },
      { id: '8', title: 'Paper coffee bag packaging mockup', dims: '120 × 80 × 250 mm', icon: '🛍️', colors: ['#c49a6c', '#ffffff', '#78350f'], has3D: true },
    ];

    // Populate Grid
    const gridContainer = document.getElementById('mockupGrid');
    function renderGrid() {
      gridContainer.innerHTML = '';
      MOCKUPS_DATA.forEach(item => {
        const card = document.createElement('div');
        card.className = 'mockup-card';
        card.onclick = () => showEditorView('standup_pouch');
        card.innerHTML = `
          <div style="height: 180px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; position: relative; font-size: 56px;">
            ${item.has3D ? '<div style="position: absolute; top: 10px; left: 10px; background: #fff; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: 800; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 2px;">3D <span>↻</span></div>' : ''}
            <div>${item.icon}</div>
          </div>
          <div style="padding: 14px; display: flex; flex-direction: column; gap: 8px;">
            <div style="font-weight: 700; font-size: 13px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.title}</div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; gap: 4px;">
                ${item.colors.map(c => `<span style="width: 14px; height: 14px; border-radius: 50%; background: ${c}; border: 1px solid #cbd5e1; display: inline-block;"></span>`).join('')}
              </div>
              <span style="font-size: 10px; font-family: monospace; color: #94a3b8;">${item.dims}</span>
            </div>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }
    renderGrid();

    // View Navigation
    const viewLibrary = document.getElementById('viewLibrary');
    const viewEditor = document.getElementById('viewEditor');
    const navTabMockups = document.getElementById('navTabMockups');
    const navTabEditor = document.getElementById('navTabEditor');

    function showLibraryView() {
      viewLibrary.style.display = 'flex';
      viewEditor.style.display = 'none';
      navTabMockups.className = 'nav-tab active';
      navTabEditor.className = 'nav-tab';
    }

    function showEditorView(model) {
      viewLibrary.style.display = 'none';
      viewEditor.style.display = 'flex';
      navTabMockups.className = 'nav-tab';
      navTabEditor.className = 'nav-tab active';
      init3D();
    }

    navTabMockups.onclick = showLibraryView;
    navTabEditor.onclick = () => showEditorView('standup_pouch');
    document.getElementById('brandLogo').onclick = showLibraryView;

    function filterCategory(cat) {
      document.getElementById('libraryCatTitle').innerText = cat === 'all' ? 'All Packaging Mockups' : cat.toUpperCase() + ' Mockups';
      renderGrid();
    }

    // --- 2. Three.js 3D Viewport Setup for Editor (Screenshot 176) ---
    let scene, camera, renderer, controls, pouchMesh;
    let is3DInit = false;

    const canvas2D = document.getElementById('hiddenDieline');
    const ctx2D = canvas2D.getContext('2d');

    // Draw initial stylish Pacdora placeholder on texture (Screenshot 176)
    function drawTexture(uploadedImg = null) {
      ctx2D.fillStyle = '#f3e8ff'; // Soft purple/lavender pouch color
      ctx2D.fillRect(0, 0, 1024, 1024);

      if (uploadedImg) {
        ctx2D.drawImage(uploadedImg, 0, 0, 1024, 1024);
      } else {
        // Subtle grid
        ctx2D.strokeStyle = 'rgba(168, 85, 247, 0.2)';
        ctx2D.lineWidth = 1;
        for (let i = 0; i < 1024; i += 64) {
          ctx2D.beginPath(); ctx2D.moveTo(i, 0); ctx2D.lineTo(i, 1024); ctx2D.stroke();
          ctx2D.beginPath(); ctx2D.moveTo(0, i); ctx2D.lineTo(1024, i); ctx2D.stroke();
        }

        // Pacdora text placeholder watermark
        ctx2D.fillStyle = 'rgba(124, 58, 237, 0.25)';
        ctx2D.font = 'bold 36px Inter, sans-serif';
        ctx2D.textAlign = 'center';
        ctx2D.fillText('pacdora', 512, 280);

        ctx2D.fillStyle = 'rgba(124, 58, 237, 0.7)';
        ctx2D.font = 'bold 38px Inter, sans-serif';
        ctx2D.fillText('Upload your images', 512, 512);
        ctx2D.font = '500 24px Inter, sans-serif';
        ctx2D.fillText('or create with AI', 512, 560);
        ctx2D.font = '600 20px monospace';
        ctx2D.fillText('491 × 733 px', 512, 600);
      }

      if (pouchMesh && pouchMesh.material.map) {
        pouchMesh.material.map.needsUpdate = true;
      }
    }
    drawTexture();

    function init3D() {
      if (is3DInit) {
        onWindowResize();
        return;
      }
      is3DInit = true;

      const container = document.getElementById('editorThreeCanvas');
      scene = new THREE.Scene();
      scene.background = new THREE.Color('#cbd5e1');

      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(1.8, 1.6, 2.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.6, 0);

      // Studio Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(3, 5, 3);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.8);
      fillLight.position.set(-3, 2, -2);
      scene.add(fillLight);

      // Ground shadow plane
      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.ShadowMaterial({ opacity: 0.18 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -0.01;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      // Pouch 3D Model Geometry (Screenshot 176)
      const texture = new THREE.CanvasTexture(canvas2D);
      texture.colorSpace = THREE.SRGBColorSpace;

      const pouchMat = new THREE.MeshPhysicalMaterial({
        map: texture,
        roughness: 0.45,
        metalness: 0.05,
        clearcoat: 0.2,
      });

      // Parametric Stand-up Pouch Mesh
      const pouchGroup = new THREE.Group();
      const w = 1.3, h = 2.25, d = 0.75;
      
      const geo = new THREE.BoxGeometry(w, h, d * 0.45, 16, 16, 16);
      pouchMesh = new THREE.Mesh(geo, pouchMat);
      pouchMesh.position.y = h / 2;
      pouchMesh.castShadow = true;
      pouchMesh.receiveShadow = true;
      pouchGroup.add(pouchMesh);

      // Top crimp seal
      const seal = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, h * 0.08, 0.05), pouchMat);
      seal.position.y = h * 0.96;
      pouchGroup.add(seal);

      scene.add(pouchGroup);

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function onWindowResize() {
      const container = document.getElementById('editorThreeCanvas');
      if (!container || !camera || !renderer) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', onWindowResize);

    // Camera Controls
    function zoomCamera(delta) {
      if (!camera) return;
      camera.position.multiplyScalar(delta > 0 ? 0.85 : 1.15);
    }

    function setCameraPreset(preset) {
      if (!camera || !controls) return;
      if (preset === 'front') {
        camera.position.set(0, 1.1, 3.2);
      } else {
        camera.position.set(1.8, 1.6, 2.8);
      }
      controls.target.set(0, 1.1, 0);
    }

    // Material Switcher
    document.getElementById('editorMatSelect').onchange = (e) => {
      const v = e.target.value;
      document.getElementById('matText').innerText = e.target.options[e.target.selectedIndex].text;
      if (!pouchMesh) return;
      if (v === 'metallic_foil') {
        pouchMesh.material.metalness = 0.85;
        pouchMesh.material.roughness = 0.2;
      } else if (v === 'coated_gloss') {
        pouchMesh.material.clearcoat = 0.9;
        pouchMesh.material.roughness = 0.15;
      } else {
        pouchMesh.material.metalness = 0.05;
        pouchMesh.material.roughness = 0.45;
        pouchMesh.material.clearcoat = 0.1;
      }
    };

    // File Upload Handler (Screenshot 176)
    document.getElementById('fileUploader').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          drawTexture(img);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    };

    // Super Export Snapshot Button
    document.getElementById('btnSuperExport').onclick = () => {
      if (!renderer) {
        showEditorView('standup_pouch');
        setTimeout(() => triggerDownload(), 300);
        return;
      }
      triggerDownload();
    };

    function triggerDownload() {
      const dataUrl = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = 'Pacdora_Mockup_Export_4K.png';
      a.href = dataUrl;
      a.click();
    }
  </script>
</body>
</html>
